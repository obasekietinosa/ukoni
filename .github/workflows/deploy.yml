name: Deploy

on:
  push:
    branches: [ "main" ]
    paths:
      - 'api/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'api/go.mod'

      - name: Build Backend
        run: |
          cd api
          mkdir -p ../dist
          go build -o ../dist/api ./cmd/api
          go build -o ../dist/migrate ./cmd/migrate
          go build -o ../dist/seeder ./cmd/seeder
          cp -r migrations ../dist/migrations

      - name: Prepare Server
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${SSH_USER}@${SSH_HOST} "mkdir -p ~/deploy"

      - name: Deploy via SFTP
        uses: SamKirkland/web-deploy@v1
        with:
          target-server: ${{ secrets.SSH_HOST }}
          remote-user: ${{ secrets.SSH_USER }}
          private-ssh-key: ${{ secrets.SSH_KEY }}
          source-path: './dist/'
          destination-path: '~/deploy/'
          rsync-options: '--chmod=+X -a --no-times'

      - name: Run Migrations
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${SSH_USER}@${SSH_HOST} "cd deploy && DATABASE_URL='$DATABASE_URL' ./migrate up"
