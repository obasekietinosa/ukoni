name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'api/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'api/**'

jobs:
  test:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ./api

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ukoni
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'api/go.mod'

    - name: Download dependencies
      run: go mod download

    - name: Run migrations
      run: go run cmd/migrate/main.go up
      env:
        DATABASE_URL: postgres://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/ukoni?sslmode=disable

    - name: Run tests
      run: go test -v ./tests/...
      env:
        DATABASE_URL: postgres://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/ukoni?sslmode=disable

  verify-docs:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ./api
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'api/go.mod'

    - name: Install swaggo
      run: go install github.com/swaggo/swag/cmd/swag@v1.16.6

    - name: Generate swagger docs
      run: swag init -g cmd/api/main.go --output docs

    - name: Verify no changes
      run: |
        if [ -n "$(git status --porcelain docs)" ]; then
          echo "Documentation is not up to date. Please run 'swag init -g cmd/api/main.go --output docs' and commit the changes."
          git diff docs
          exit 1
        fi
