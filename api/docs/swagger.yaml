paths:
  /canonical-products/{id}:
    delete:
      description: Delete a canonical product from the inventory.
      parameters:
      - description: Canonical Product ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: invalid request
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "404":
          description: product not found
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Delete canonical product
      tags:
      - Canonical Product
    get:
      description: Get details of a specific canonical product.
      parameters:
      - description: Canonical Product ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.CanonicalProduct'
        "400":
          description: invalid request
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "404":
          description: product not found
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get canonical product
      tags:
      - Canonical Product
    put:
      consumes:
      - application/json
      description: Update details of an existing canonical product.
      parameters:
      - description: Canonical Product ID
        in: path
        name: id
        required: true
        type: string
      - description: Canonical Product Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CanonicalProductRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.CanonicalProduct'
        "400":
          description: invalid request
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "404":
          description: product not found
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Update canonical product
      tags:
      - Canonical Product
