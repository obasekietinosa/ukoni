servers:
  - url: //localhost:8080
components:
  requestBodies:
    handlers.ProductRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/handlers.ProductRequest"
      description: Product Request
      required: true
    handlers.VariantRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/handlers.VariantRequest"
      description: Variant Request
      required: true
    handlers.CanonicalProductRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/handlers.CanonicalProductRequest"
      description: Canonical Product Request
      required: true
    handlers.OutletRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/handlers.OutletRequest"
      description: Outlet Request
      required: true
    handlers.SellerRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/handlers.SellerRequest"
      description: Seller Request
      required: true
  securitySchemes:
    BearerAuth:
      type: apiKey
      name: Authorization
      in: header
  schemas:
    handlers.AcceptInviteRequest:
      type: object
      properties:
        token:
          type: string
    handlers.AddItemRequest:
      type: object
      properties:
        notes:
          type: string
        quantity:
          type: number
        target_id:
          type: string
        target_type:
          type: string
        unit:
          type: string
    handlers.AddPlanToGroupRequest:
      type: object
      properties:
        plan_id:
          type: string
    handlers.CanonicalProductRequest:
      type: object
      properties:
        category_id:
          type: string
        description:
          type: string
        name:
          type: string
    handlers.CategoryRequest:
      type: object
      properties:
        name:
          type: string
        parent_category_id:
          type: string
    handlers.CreateConsumptionRequest:
      type: object
      properties:
        canonical_product_id:
          type: string
        consumed_at:
          description: ISO8601 string
          type: string
